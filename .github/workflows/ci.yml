name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Create stub secrets.h
        run: cp src/secrets.example.h src/secrets.h

      - name: Build ESP32-C3 firmware
        run: pio run -e c3

      - name: Build classic ESP32 firmware
        run: pio run -e esp32dev

      - name: Run blocklist tests
        run: python3 tools/test_build_blocklist.py

      - name: Run DNS packet parser tests
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror tools/test_dns_packet.cpp -o /tmp/test_dns_packet
          /tmp/test_dns_packet

      - name: Build default blocklist
        run: |
          mkdir -p data
          python3 tools/build_blocklist.py data/blocklist.bin

      - name: Build filesystem image
        run: pio run -e c3 -t buildfs

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v5
        with:
          name: firmware
          path: |
            .pio/build/c3/firmware.bin
            .pio/build/c3/bootloader.bin
            .pio/build/c3/partitions.bin
          retention-days: 7

      - name: Upload blocklist artifact
        uses: actions/upload-artifact@v5
        with:
          name: blocklist
          path: data/blocklist.bin
          retention-days: 7
